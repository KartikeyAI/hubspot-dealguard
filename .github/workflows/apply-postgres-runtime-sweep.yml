name: Apply PostgreSQL runtime SQL sweep

on:
  push:
    branches: [agent/neon-hyperdrive-tigris-queues]
    paths: [.github/workflows/apply-postgres-runtime-sweep.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neon-hyperdrive-tigris-queues
          fetch-depth: 0
      - name: Apply reviewed PostgreSQL and Queue transformations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          function mutate(path, changes) {
            let value = fs.readFileSync(path, 'utf8');
            for (const [from, to] of changes) {
              if (!value.includes(from)) throw new Error(`Expected source was not found in ${path}: ${from.slice(0, 100)}`);
              value = value.replace(from, to);
            }
            fs.writeFileSync(path, value);
          }

          mutate('worker/src/audit-chain.ts', [[
            '`INSERT OR IGNORE INTO legacy_audit_promotions (legacy_event_id, immutable_event_id, promoted_at) VALUES (?, ?, ?)`',
            '`INSERT INTO legacy_audit_promotions (legacy_event_id, immutable_event_id, promoted_at) VALUES (?, ?, ?) ON CONFLICT(legacy_event_id) DO NOTHING`',
          ]]);

          mutate('worker/src/billing.ts', [[
            "`INSERT OR IGNORE INTO billing_usage_events (id, portal_id, event_name, quantity, idempotency_key, status, metadata_json, occurred_at, created_at)\n     VALUES (?, ?, ?, ?, ?, 'pending', ?, ?, ?)`",
            "`INSERT INTO billing_usage_events (id, portal_id, event_name, quantity, idempotency_key, status, metadata_json, occurred_at, created_at)\n     VALUES (?, ?, ?, ?, ?, 'pending', ?, ?, ?) ON CONFLICT(portal_id, idempotency_key) DO NOTHING`",
          ]]);

          mutate('worker/src/billing-usage.ts', [
            ["`INSERT OR IGNORE INTO billing_usage_counters (portal_id, metric, period_start, consumed_quantity, updated_at)\n       SELECT ?, ?, ?, COALESCE(SUM(quantity), 0), ? FROM billing_usage_events\n       WHERE portal_id = ? AND event_name = ? AND occurred_at >= ?`", "`INSERT INTO billing_usage_counters (portal_id, metric, period_start, consumed_quantity, updated_at)\n       SELECT ?, ?, ?, COALESCE(SUM(quantity), 0), ? FROM billing_usage_events\n       WHERE portal_id = ? AND event_name = ? AND occurred_at >= ?\n       ON CONFLICT(portal_id, metric, period_start) DO NOTHING`"],
            ["`INSERT OR IGNORE INTO billing_usage_events\n       (id, portal_id, event_name, quantity, idempotency_key, status, metadata_json, occurred_at, created_at)\n       SELECT ?, ?, ?, ?, ?, 'pending', ?, ?, ?\n       WHERE (? = 1 OR ? IS NULL OR\n         COALESCE((SELECT consumed_quantity FROM billing_usage_counters\n                   WHERE portal_id = ? AND metric = ? AND period_start = ?), 0) + ? <= ?)`", "`INSERT INTO billing_usage_events\n       (id, portal_id, event_name, quantity, idempotency_key, status, metadata_json, occurred_at, created_at)\n       SELECT ?, ?, ?, ?, ?, 'pending', ?, ?, ?\n       WHERE (? = 1 OR ? IS NULL OR\n         COALESCE((SELECT consumed_quantity FROM billing_usage_counters\n                   WHERE portal_id = ? AND metric = ? AND period_start = ?), 0) + ? <= ?)\n       ON CONFLICT(portal_id, idempotency_key) DO NOTHING`"],
            ["`INSERT OR IGNORE INTO billing_usage_counters (portal_id, metric, period_start, consumed_quantity, updated_at)\n       SELECT ?, ?, ?, COALESCE(MAX(\n         CASE WHEN json_valid(metadata_json)\n           THEN COALESCE(CAST(json_extract(metadata_json, '$.provider_quantity') AS REAL), quantity)\n           ELSE quantity END\n       ), 0), ? FROM billing_usage_events\n       WHERE portal_id = ? AND event_name = ? AND occurred_at >= ?`", "`INSERT INTO billing_usage_counters (portal_id, metric, period_start, consumed_quantity, updated_at)\n       SELECT ?, ?, ?, COALESCE(MAX(\n         COALESCE(NULLIF(metadata_json::jsonb ->> 'provider_quantity', '')::DOUBLE PRECISION, quantity)\n       ), 0), ? FROM billing_usage_events\n       WHERE portal_id = ? AND event_name = ? AND occurred_at >= ?\n       ON CONFLICT(portal_id, metric, period_start) DO NOTHING`"],
            ["`INSERT OR IGNORE INTO billing_usage_events\n       (id, portal_id, event_name, quantity, idempotency_key, status, metadata_json, occurred_at, created_at)\n       SELECT ?, ?, ?, MAX(0, ? - COALESCE((\n         SELECT consumed_quantity FROM billing_usage_counters\n         WHERE portal_id = ? AND metric = ? AND period_start = ?\n       ), 0)), ?, 'pending', ?, ?, ?\n       WHERE (? = 1 OR ? IS NULL OR ? <= ?)`", "`INSERT INTO billing_usage_events\n       (id, portal_id, event_name, quantity, idempotency_key, status, metadata_json, occurred_at, created_at)\n       SELECT ?, ?, ?, GREATEST(0, ? - COALESCE((\n         SELECT consumed_quantity FROM billing_usage_counters\n         WHERE portal_id = ? AND metric = ? AND period_start = ?\n       ), 0)), ?, 'pending', ?, ?, ?\n       WHERE (? = 1 OR ? IS NULL OR ? <= ?)\n       ON CONFLICT(portal_id, idempotency_key) DO NOTHING`"],
            ['consumed_quantity = MAX(billing_usage_counters.consumed_quantity, excluded.consumed_quantity)', 'consumed_quantity = GREATEST(billing_usage_counters.consumed_quantity, excluded.consumed_quantity)'],
          ]);

          mutate('worker/src/change-control.ts', [[
            "`INSERT OR IGNORE INTO change_approval_executions\n     (approval_id, portal_id, status, attempts, lease_expires_at, started_at,\n      applied_by_user_id, applied_by_email, updated_at)\n     VALUES (?, ?, 'applying', 1, ?, ?, ?, ?, ?)`",
            "`INSERT INTO change_approval_executions\n     (approval_id, portal_id, status, attempts, lease_expires_at, started_at,\n      applied_by_user_id, applied_by_email, updated_at)\n     VALUES (?, ?, 'applying', 1, ?, ?, ?, ?, ?) ON CONFLICT(approval_id) DO NOTHING`",
          ]]);

          mutate('worker/src/reliability.ts', [[
            "`SELECT * FROM synthetic_checks WHERE enabled = 1 AND (last_checked_at IS NULL OR datetime(last_checked_at, '+' || interval_minutes || ' minutes') <= datetime('now')) LIMIT 100`",
            "`SELECT * FROM synthetic_checks WHERE enabled = 1 AND (last_checked_at IS NULL OR last_checked_at::timestamptz + interval_minutes * INTERVAL '1 minute' <= NOW()) LIMIT 100`",
          ]]);

          mutate('worker/src/remediation.ts', [[
            "AVG(CASE WHEN resolved_at IS NOT NULL THEN (julianday(resolved_at) - julianday(created_at)) * 24 END) AS average_resolution_hours",
            "AVG(CASE WHEN resolved_at IS NOT NULL THEN EXTRACT(EPOCH FROM (resolved_at::timestamptz - created_at::timestamptz)) / 3600.0 END) AS average_resolution_hours",
          ]]);

          mutate('worker/src/enterprise-analytics-v2.ts', [[
            "AVG(CASE WHEN confirmed_at IS NOT NULL THEN (julianday(confirmed_at) - julianday(created_at)) * 24 END) AS average_hours",
            "AVG(CASE WHEN confirmed_at IS NOT NULL THEN EXTRACT(EPOCH FROM (confirmed_at::timestamptz - created_at::timestamptz)) / 3600.0 END) AS average_hours",
          ]]);

          mutate('worker/src/config.ts', [["export const APP_VERSION = '2.0.0-rc.1';", "export const APP_VERSION = '2.1.0-rc.1';"]]);

          mutate('worker/src/data-deletion.ts', [
            ["import { sha256Hex } from './crypto.js';\n", "import { sha256Hex } from './crypto.js';\nimport { deleteTenantObjects } from './object-storage.js';\n"],
            ["  const now = new Date().toISOString();\n", "  const now = new Date().toISOString();\n  await deleteTenantObjects(env, identity.portalId);\n"],
          ]);

          mutate('worker/src/remediation-enterprise.ts', [[
            "SELECT id, evidence_type, label, value, content_hash, submitted_by_user_id, submitted_by_email, created_at FROM remediation_evidence",
            "SELECT id, evidence_type, label, value, content_hash, object_upload_id, object_key, content_type, size_bytes, object_etag, submitted_by_user_id, submitted_by_email, created_at FROM remediation_evidence",
          ]]);

          mutate('worker/src/outbox.ts', [
            ["import { Repository } from './repository.js';\n", "import { Repository } from './repository.js';\nimport { wakeDeliveryQueue } from './queue-publisher.js';\n"],
            ["  ).bind(id, input.portalId, input.eventType.slice(0, 128), input.severity ?? 'info', input.pipelineId ?? null, input.aggregateType.slice(0, 64), input.aggregateId.slice(0, 128), JSON.stringify(input.payload), now, now).run();\n  return id;", "  ).bind(id, input.portalId, input.eventType.slice(0, 128), input.severity ?? 'info', input.pipelineId ?? null, input.aggregateType.slice(0, 64), input.aggregateId.slice(0, 128), JSON.stringify(input.payload), now, now).run();\n  await Promise.all([wakeDeliveryQueue(env, 'enterprise_alerts'), wakeDeliveryQueue(env, 'outbox')]);\n  return id;"],
            ["  await new Repository(env).audit(identity.portalId, identity.userId, identity.userEmail, 'outbox.replayed', { eventId });\n}", "  await new Repository(env).audit(identity.portalId, identity.userId, identity.userEmail, 'outbox.replayed', { eventId });\n  await Promise.all([wakeDeliveryQueue(env, 'enterprise_alerts'), wakeDeliveryQueue(env, 'outbox')]);\n}"],
          ]);

          mutate('worker/src/routes-v2.ts', [
            ["import { scanPortal } from './scanner.js';", "import { enqueueScan } from './queue-publisher.js';"],
            ["version: '2.0.0-rc.1'", "version: '2.1.0-rc.1'"],
            ["    await repository.upsertTenant(tokens, info);\n    ctx.waitUntil(scanPortal(env, String(info.hub_id), 'install'));", "    await repository.upsertTenant(tokens, info);\n    const installPortalId = String(info.hub_id);\n    const installScanId = await repository.startScan(installPortalId, 'install');\n    ctx.waitUntil(enqueueScan(env, { portalId: installPortalId, trigger: 'install', scanId: installScanId }).catch(async (error) => {\n      await repository.failScan(installScanId, installPortalId, error instanceof Error ? error.message : String(error)).catch(() => undefined);\n      console.error(JSON.stringify({ level: 'error', task: 'install_scan_enqueue', portalId: installPortalId, scanId: installScanId, error: error instanceof Error ? error.message : String(error) }));\n    }));"],
            ["    const scanId = await repository.startScan(identity.portalId, 'manual');\n    ctx.waitUntil(scanPortal(env, identity.portalId, 'manual', scanId).catch((error) => {\n      console.error(JSON.stringify({ level: 'error', task: 'manual_scan', portalId: identity.portalId, scanId, error: error instanceof Error ? error.message : String(error) }));\n    }));", "    const scanId = await repository.startScan(identity.portalId, 'manual');\n    ctx.waitUntil(enqueueScan(env, { portalId: identity.portalId, trigger: 'manual', scanId }).catch(async (error) => {\n      await repository.failScan(scanId, identity.portalId, error instanceof Error ? error.message : String(error)).catch(() => undefined);\n      console.error(JSON.stringify({ level: 'error', task: 'manual_scan_enqueue', portalId: identity.portalId, scanId, error: error instanceof Error ? error.message : String(error) }));\n    }));"],
          ]);

          mutate('worker/src/enterprise-routes.ts', [
            ["import {\n  createCustomerPortalSession,", "import { attachmentDownloadUrl, completeAttachmentUpload, createAttachmentUpload } from './attachments.js';\nimport {\n  createCustomerPortalSession,"],
            ["  createDataExport,\n  createLegalHold,", "  createDataExport,\n  dataExportStatus,\n  createLegalHold,"],
            ["  if (path === '/api/v1/enterprise/compliance') {", "  if (path === '/api/v1/enterprise/storage/uploads') {\n    if (request.method !== 'POST') return methodNotAllowed(['POST']);\n    await requireEnterprise(env, identity);\n    return json(await createAttachmentUpload(env, identity, await readJson<unknown>(request)), 201);\n  }\n  const uploadComplete = idMatch(path, /^\\/api\\/v1\\/enterprise\\/storage\\/uploads\\/([^/]+)\\/complete$/);\n  if (uploadComplete) {\n    if (request.method !== 'POST') return methodNotAllowed(['POST']);\n    await requireEnterprise(env, identity);\n    return json(await completeAttachmentUpload(env, identity, uploadComplete[1]!));\n  }\n  const uploadDownload = idMatch(path, /^\\/api\\/v1\\/enterprise\\/storage\\/uploads\\/([^/]+)\\/download$/);\n  if (uploadDownload) {\n    if (request.method !== 'GET') return methodNotAllowed(['GET']);\n    await requireEnterprise(env, identity);\n    return json(await attachmentDownloadUrl(env, identity, uploadDownload[1]!));\n  }\n\n  if (path === '/api/v1/enterprise/compliance') {"],
            ["  const exportDownload = idMatch(path, /^\\/api\\/v1\\/enterprise\\/compliance\\/exports\\/([^/]+)\\/download$/);", "  const exportStatus = idMatch(path, /^\\/api\\/v1\\/enterprise\\/compliance\\/exports\\/([^/]+)$/);\n  if (exportStatus) {\n    if (request.method !== 'GET') return methodNotAllowed(['GET']);\n    await requireEnterprise(env, identity);\n    return json(await dataExportStatus(env, identity, exportStatus[1]!));\n  }\n  const exportDownload = idMatch(path, /^\\/api\\/v1\\/enterprise\\/compliance\\/exports\\/([^/]+)\\/download$/);"],
          ]);

          for (const file of ['worker/src/audit-chain.ts','worker/src/billing.ts','worker/src/billing-usage.ts','worker/src/change-control.ts']) {
            const source = fs.readFileSync(file, 'utf8');
            if (source.includes('INSERT OR IGNORE')) throw new Error(`${file} still contains INSERT OR IGNORE.`);
          }
          fs.rmSync('.github/workflows/apply-postgres-runtime-sweep.yml');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "complete PostgreSQL runtime SQL and Queue conversion"
          git push origin HEAD:agent/neon-hyperdrive-tigris-queues
