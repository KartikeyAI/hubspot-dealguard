name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm install --ignore-scripts --prefix src/app/cards
      - run: npm install --ignore-scripts --prefix src/app/settings
      - run: npm run check
      - run: npx wrangler d1 migrations apply dealguard-production --local
