name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --silent
      - run: npm install --ignore-scripts --silent --prefix src/app/cards
      - run: npm install --ignore-scripts --silent --prefix src/app/settings
      - run: npm install --ignore-scripts --silent --prefix src/app/pages
      - name: Typecheck Worker
        id: worker_typecheck
        continue-on-error: true
        run: npm run typecheck > worker-typecheck.log 2>&1
      - name: Upload Worker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-typecheck-${{ github.sha }}
          path: worker-typecheck.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Worker typecheck
        if: steps.worker_typecheck.outcome == 'failure'
        run: cat worker-typecheck.log && exit 1
      - name: Typecheck deal card
        run: npm run typecheck --prefix src/app/cards
      - name: Typecheck settings extension
        run: npm run typecheck --prefix src/app/settings
      - name: Typecheck enterprise App Home
        run: npm run typecheck --prefix src/app/pages
      - name: Run automated tests
        run: npm test
      - name: Validate HubSpot manifests
        run: node -e "const fs=require('fs'); for (const f of ['src/app/app-hsmeta.json','src/app/webhooks/deal-events-hsmeta.json','src/app/workflow-actions/assess-deal-hsmeta.json','src/app/workflow-actions/create-remediation-hsmeta.json','src/app/pages/pages-hsmeta.json']) JSON.parse(fs.readFileSync(f,'utf8'));"
      - run: npx wrangler d1 migrations apply dealguard-production --local
