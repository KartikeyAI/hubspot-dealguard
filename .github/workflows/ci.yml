name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dealguard
          POSTGRES_PASSWORD: dealguard-test-password
          POSTGRES_DB: dealguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealguard -d dealguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://dealguard:dealguard-test-password@127.0.0.1:5432/dealguard_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --silent
      - run: npm install --ignore-scripts --silent --prefix src/app/cards
      - run: npm install --ignore-scripts --silent --prefix src/app/settings
      - run: npm install --ignore-scripts --silent --prefix src/app/pages
      - name: Typecheck Worker
        id: worker_typecheck
        continue-on-error: true
        run: npm run typecheck > worker-typecheck.log 2>&1
      - name: Upload Worker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-typecheck-${{ github.sha }}
          path: worker-typecheck.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Worker typecheck
        if: steps.worker_typecheck.outcome == 'failure'
        run: cat worker-typecheck.log && exit 1
      - name: Typecheck deal card
        run: npm run typecheck --prefix src/app/cards
      - name: Typecheck settings extension
        run: npm run typecheck --prefix src/app/settings
      - name: Typecheck App Home
        run: npm run typecheck --prefix src/app/pages
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
      - name: Verify immutable PostgreSQL migration checksums
        run: npm run db:migrate:check
      - name: Validate PostgreSQL schema and tenant constraints
        run: npm run db:validate
      - name: Run automated tests
        run: npm test
      - name: Validate HubSpot manifests
        run: node -e "for (const file of ['hsproject.json','src/app/app-hsmeta.json','src/app/cards/dealguard-card-hsmeta.json','src/app/settings/dealguard-settings-hsmeta.json','src/app/pages/pages-hsmeta.json','src/app/webhooks/deal-events-hsmeta.json','src/app/workflow-actions/assess-deal-hsmeta.json','src/app/workflow-actions/create-remediation-hsmeta.json']) JSON.parse(require('fs').readFileSync(file, 'utf8')); console.log('manifests valid')"
      - name: Render non-secret staging configuration
        run: |
          mkdir -p .release
          node - <<'NODE'
          const fs = require('fs');
          let value = fs.readFileSync('wrangler.toml', 'utf8');
          const replacements = {
            REPLACE_WITH_LOCAL_HUBSPOT_APP_ID: '123456',
            REPLACE_WITH_STAGING_HUBSPOT_APP_ID: '123456',
            REPLACE_WITH_PRODUCTION_HUBSPOT_APP_ID: '123456',
            REPLACE_WITH_STAGING_HYPERDRIVE_ID: '0123456789abcdef0123456789abcdef',
            REPLACE_WITH_PRODUCTION_HYPERDRIVE_ID: '0123456789abcdef0123456789abcdef',
            REPLACE_WITH_LOCAL_TIGRIS_BUCKET: 'dealguard-ci',
            REPLACE_WITH_STAGING_TIGRIS_BUCKET: 'dealguard-ci',
            REPLACE_WITH_PRODUCTION_TIGRIS_BUCKET: 'dealguard-ci',
          };
          for (const [from, to] of Object.entries(replacements)) value = value.replaceAll(from, to);
          value = value.replace(/^main\s*=\s*"[^"]+"/m, 'main = "../worker/src/index.ts"');
          if (value.includes('REPLACE_WITH_')) throw new Error('CI Wrangler rendering left a placeholder.');
          fs.writeFileSync('.release/ci-wrangler.toml', value, { mode: 0o600 });
          NODE
      - name: Validate Cloudflare deployment configuration
        id: wrangler_dry_run
        continue-on-error: true
        run: npx wrangler deploy --dry-run --env staging --config .release/ci-wrangler.toml --outdir .release/worker-staging > wrangler-dry-run.log 2>&1
      - name: Upload Wrangler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-dry-run-${{ github.sha }}
          path: wrangler-dry-run.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Cloudflare deployment configuration
        if: steps.wrangler_dry_run.outcome == 'failure'
        run: cat wrangler-dry-run.log && exit 1
