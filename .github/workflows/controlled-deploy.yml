name: Controlled deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected deployment environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      release_sha:
        description: Full immutable commit SHA to deploy
        required: true
        type: string
      backup_reference:
        description: Provider-managed backup or restore-point reference created before this change
        required: true
        type: string
      staging_run_id:
        description: Successful Controlled deploy staging run ID; required for production
        required: false
        type: string
      acceptance_profile:
        description: Signed post-deployment acceptance profile
        required: true
        default: read-only
        type: choice
        options: [read-only, full]
      portal_id:
        description: HubSpot developer-test portal ID
        required: true
        type: string
      user_id:
        description: HubSpot acceptance user ID
        required: false
        type: string
      user_email:
        description: HubSpot installer/admin acceptance email
        required: true
        type: string
      expected_tier:
        description: Expected portal commercial tier
        required: false
        type: choice
        options: ['', free, growth, enterprise]
      test_deal_id:
        description: Existing test deal ID used by the full profile
        required: false
        type: string
      checkout_tier:
        description: Non-paying checkout session tier used by full acceptance
        required: true
        default: enterprise
        type: choice
        options: [growth, enterprise]
      checkout_interval:
        description: Non-paying checkout session interval used by full acceptance
        required: true
        default: year
        type: choice
        options: [month, year]

permissions:
  contents: read
  actions: read

concurrency:
  group: dealguard-controlled-deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dealguard-${{ inputs.target }}
    timeout-minutes: 45
    env:
      RELEASE_TARGET: ${{ inputs.target }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_INCLUDE_HUBSPOT_UPLOAD: 'false'
      BACKUP_REFERENCE: ${{ inputs.backup_reference }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      HUBSPOT_APP_ID: ${{ vars.HUBSPOT_APP_ID }}
      HUBSPOT_CLIENT_ID: ${{ vars.HUBSPOT_CLIENT_ID }}
      HUBSPOT_CLIENT_SECRET: ${{ secrets.HUBSPOT_CLIENT_SECRET }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SLACK_CLIENT_ID: ${{ vars.SLACK_CLIENT_ID }}
      SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
      DODO_API_KEY: ${{ secrets.DODO_API_KEY }}
      DODO_WEBHOOK_SECRET: ${{ secrets.DODO_WEBHOOK_SECRET }}
      DODO_ENVIRONMENT: ${{ vars.DODO_ENVIRONMENT }}
      DODO_GROWTH_MONTHLY_PRODUCT_ID: ${{ vars.DODO_GROWTH_MONTHLY_PRODUCT_ID }}
      DODO_GROWTH_YEARLY_PRODUCT_ID: ${{ vars.DODO_GROWTH_YEARLY_PRODUCT_ID }}
      DODO_ENTERPRISE_MONTHLY_PRODUCT_ID: ${{ vars.DODO_ENTERPRISE_MONTHLY_PRODUCT_ID }}
      DODO_ENTERPRISE_YEARLY_PRODUCT_ID: ${{ vars.DODO_ENTERPRISE_YEARLY_PRODUCT_ID }}
      DODO_AI_CREDIT_EVENT_NAME: ${{ vars.DODO_AI_CREDIT_EVENT_NAME }}
      DODO_ACTIVE_DEAL_EVENT_NAME: ${{ vars.DODO_ACTIVE_DEAL_EVENT_NAME }}
      DODO_EVENT_OVERAGE_EVENT_NAME: ${{ vars.DODO_EVENT_OVERAGE_EVENT_NAME }}
      DODO_RETENTION_EVENT_NAME: ${{ vars.DODO_RETENTION_EVENT_NAME }}
      ACCEPTANCE_PROFILE: ${{ inputs.acceptance_profile }}
      ACCEPTANCE_BASE_URL: ${{ vars.APP_BASE_URL }}
      ACCEPTANCE_PORTAL_ID: ${{ inputs.portal_id }}
      ACCEPTANCE_USER_ID: ${{ inputs.user_id }}
      ACCEPTANCE_USER_EMAIL: ${{ inputs.user_email }}
      ACCEPTANCE_EXPECT_TIER: ${{ inputs.expected_tier }}
      ACCEPTANCE_TEST_DEAL_ID: ${{ inputs.test_deal_id }}
      ACCEPTANCE_CHECKOUT_TIER: ${{ inputs.checkout_tier }}
      ACCEPTANCE_CHECKOUT_INTERVAL: ${{ inputs.checkout_interval }}
      ACCEPTANCE_OPERATOR: ${{ github.actor }}

    steps:
      - name: Validate immutable deployment inputs
        shell: bash
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'release_sha must be a full commit SHA'; exit 1; }
          [ -n "$BACKUP_REFERENCE" ] || { echo 'backup_reference is required'; exit 1; }
          if [ "$RELEASE_TARGET" = production ] && [ -z "${{ inputs.staging_run_id }}" ]; then
            echo 'staging_run_id is required for production promotion'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --ignore-scripts --silent
          npm install --ignore-scripts --silent --prefix src/app/cards
          npm install --ignore-scripts --silent --prefix src/app/settings
          npm install --ignore-scripts --silent --prefix src/app/pages

      - name: Run complete repository gate
        run: npm run check

      - name: Run protected release preflight
        run: npm run release:preflight

      - name: Verify matching staging deployment before production
        if: inputs.target == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          mkdir -p .release/staging-evidence
          gh run download "$STAGING_RUN_ID" --dir .release/staging-evidence
          npm run release:verify-staging -- --input .release/staging-evidence

      - name: Apply reviewed remote D1 migrations
        run: npx wrangler d1 migrations apply dealguard-production --remote --config .release/wrangler.toml

      - name: Deploy Worker
        run: npx wrangler deploy --config .release/wrangler.toml

      - name: Verify deployed health and release version
        run: |
          mkdir -p .release
          curl --fail --silent --show-error --retry 10 --retry-delay 6 "$APP_BASE_URL/health" > .release/health.json
          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('.release/health.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (health.version !== pkg.version) throw new Error(`Health version ${health.version} does not match ${pkg.version}`);
          NODE

      - name: Run signed post-deployment acceptance
        run: npm run acceptance:live

      - name: Record source and migration checksums
        run: |
          sha256sum package.json wrangler.toml src/app/app-hsmeta.json src/app/pages/pages-hsmeta.json > .release/release-checksums.txt
          find worker/migrations -type f -name '*.sql' -print0 | sort -z | xargs -0 sha256sum > .release/migration-checksums.txt

      - name: Generate deployment evidence record
        run: npm run release:record

      - name: Publish deployment summary
        if: always()
        run: |
          if [ -f .release/deployment-record.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
            const fs = require('fs');
            const record = JSON.parse(fs.readFileSync('.release/deployment-record.json', 'utf8'));
            console.log('## DealGuard controlled deployment');
            console.log(`- Target: **${record.target}**`);
            console.log(`- Version: **${record.version}**`);
            console.log(`- Commit: \`${record.commit}\``);
            console.log(`- Result: **${record.result}**`);
            console.log(`- Backup reference recorded: **${Boolean(record.backupReference)}**`);
            NODE
          fi

      - name: Remove ephemeral rendered configuration
        if: always()
        run: rm -f .release/wrangler.toml

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dealguard-deployment-${{ inputs.target }}-${{ github.run_id }}
          path: |
            .release/deployment-record.json
            .release/preflight.json
            .release/health.json
            .release/release-checksums.txt
            .release/migration-checksums.txt
            artifacts/acceptance/
          if-no-files-found: warn
          retention-days: 90
