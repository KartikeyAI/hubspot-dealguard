name: Development batch validation
on:
  push:
    branches: [feat/dealguard-3-phase1-release-baseline]
    paths: ['.development/**', '.github/workflows/development-batch.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dealguard
          POSTGRES_PASSWORD: dealguard-test-password
          POSTGRES_DB: dealguard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dealguard -d dealguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      INPUT_SHA: ${{ github.sha }}
      DATABASE_URL: postgresql://dealguard:dealguard-test-password@127.0.0.1:5432/dealguard_test
      DEALGUARD_ANALYTICS_TEST_DATABASE_URL: postgresql://dealguard:dealguard-test-password@127.0.0.1:5432/dealguard_test
      DEALGUARD_CUTOVER_TEST_DATABASE_URL: postgresql://dealguard:dealguard-test-password@127.0.0.1:5432/dealguard_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble hash-verified reviewed changes as data
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,lzma,os,re,subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          base='86761582ff798ef31d44f81008351567a021dded'
          target='9db78079ef45205c041d656e8376c652522e4964'
          parts=[f'.development/closedloop-{i}.part' for i in range(7)]
          helpers=parts+['.github/workflows/development-batch.yml']
          assert git('rev-parse','HEAD')==os.environ['INPUT_SHA']
          subprocess.run(['git','merge-base','--is-ancestor',base,os.environ['INPUT_SHA']],check=True)
          assert set(git('diff','--name-only',base,os.environ['INPUT_SHA']).splitlines())==set(helpers)
          compressed=b''.join(Path(p).read_bytes() for p in parts)
          assert len(compressed)==22388 and hashlib.sha256(compressed).hexdigest()=='2dc694cfea0a40ea8f577decbc6b3c0dc53a7b4c78b7e75d91a3cfad2fb198a3'
          raw=lzma.decompress(compressed,memlimit=134217728)
          assert len(raw)==95425
          entries=json.loads(raw); paths=[e['path'] for e in entries]
          assert len(paths)==26 and len(set(paths))==len(paths)
          for e in entries:
            f=e['path']; p=Path(f)
            assert re.fullmatch(r'(database|docs|scripts|src|test|worker)/[A-Za-z0-9_./-]+',f) and '..' not in p.parts
            assert not p.is_symlink() and all(not a.is_symlink() for a in p.parents)
            old=p.read_bytes() if p.exists() else b''
            before=hashlib.sha1(b'blob '+str(len(old)).encode()+b'\0'+old).hexdigest() if p.exists() else None
            assert before==e['before'], 'Wrong base: '+f
            lines=old.decode().splitlines(keepends=True); end=len(lines)
            for c in reversed(e['changes']):
              assert type(c['start']) is int and type(c['end']) is int and 0<=c['start']<=c['end']<=end
              lines[c['start']:c['end']]=c['text'].splitlines(keepends=True); end=c['start']
            p.parent.mkdir(parents=True,exist_ok=True);p.write_text(''.join(lines))
          p=Path('test/recommendation-remediation-postgres.test.mjs');text=p.read_text()
          fixes=[
            ("portal_id,deal_id,deal_name,score,grade,status,summary,issues_json,issue_codes_json,issue_count,is_closed,is_won,assessed_at,reviewed_at)","portal_id,deal_id,deal_name,pipeline_label,stage_label,score,grade,status,readiness_summary,issues_json,is_closed,is_won,assessed_at)"),
            ("VALUES($1,$2,'Deal',80,'B','at_risk','Summary','[]','[]',0,0,0,$3,$3)","VALUES($1,$2,'Deal','Pipeline','Stage',80,'B','at_risk','Summary','[]',0,0,$3)"),
            ("assessment_at,generated_at,brief_status,attention_score,confidence,coverage_percent,freshness_status,updated_at,next_action_code)","assessment_at,generated_at,methodology,brief_status,attention_score,confidence,coverage_percent,freshness_status,created_at,updated_at,next_action_code)"),
            ("VALUES($1,$2,$3,$4,'needs_attention',50,'medium',100,'fresh',$4,'readiness_next_step')","VALUES($1,$2,$3,$4,'deterministic_evidence_synthesis','watch',50,'medium',100,'fresh',$4,$4,'readiness_next_step')"),
            ("deal_id,fingerprint,recommendation_code,recommendation_label,recommendation_text,dimension,priority,owner_role,due_at,rationale,","deal_id,recommendation_fingerprint,recommendation_code,recommendation_label,recommendation_text,recommendation_dimension,priority,owner_role,due_at,rationale,methodology,status,"),
            ("baseline_assessment_at,baseline_snapshot_at,","baseline_assessment_at,baseline_snapshot_generated_at,"),
            ("$5,'Missing next step',$6,$7,","$5,'Missing next step','deterministic_evidence_synthesis','presented',$6,$7,")
          ]
          for before,after in fixes:
            assert text.count(before)==1
            text=text.replace(before,after)
          p.write_text(text)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','rm','--',*helpers],check=True)
          actual=git('write-tree')
          assert actual==target, 'Source tree mismatch: '+actual
          subprocess.run(['git','-c','user.name=DealGuard development automation','-c','user.email=development@users.noreply.github.com','commit','-m','feat: atomic recommendation remediation and scoped work console'],check=True)
          print('Exact reviewed product tree:',target)
          PY
      - name: Record immutable candidate baseline
        run: node scripts/release-baseline.mjs --target staging
      - name: Install real Worker and UI dependencies
        run: |
          touch .env
          npm install --ignore-scripts --silent
          npm install --ignore-scripts --silent --prefix src/app/cards
          npm install --ignore-scripts --silent --prefix src/app/settings
          npm install --ignore-scripts --silent --prefix src/app/pages
      - name: Validate builds and additive migrations
        run: |
          npm run release:convergence
          npm run typecheck
          npm run typecheck --prefix src/app/cards
          npm run typecheck --prefix src/app/settings
          npm run typecheck --prefix src/app/pages
          npm run db:migrate
          npm run db:migrate:check
          npm run db:validate
      - name: Execute all regression tests
        shell: bash
        run: npm test 2>&1 | tee "$RUNNER_TEMP/batch-tests.log"
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/batch-tests.log
          if-no-files-found: warn
          retention-days: 7
      - name: Package tested candidate
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          git bundle create "$RUNNER_TEMP/candidate/source.bundle" HEAD "^$INPUT_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/candidate/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7
  publish-candidate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
      - name: Verify and publish only a non-production candidate
        env:
          INPUT_SHA: ${{ github.sha }}
          PUBLISH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,os,re,subprocess
          from pathlib import Path
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          p=Path(os.environ['RUNNER_TEMP'])/'candidate';sha=(p/'commit.txt').read_text().strip()
          assert re.fullmatch('[0-9a-f]{40}',sha) and (p/'source.bundle').stat().st_size<2000000
          subprocess.run(['git','bundle','verify',str(p/'source.bundle')],check=True)
          subprocess.run(['git','fetch',str(p/'source.bundle'),'HEAD:refs/heads/validated-candidate'],check=True)
          assert git('rev-parse','validated-candidate')==sha
          assert git('rev-parse',sha+'^')==os.environ['INPUT_SHA']
          assert git('rev-parse',sha+'^{tree}')=='9db78079ef45205c041d656e8376c652522e4964'
          assert git('rev-list','--count',os.environ['INPUT_SHA']+'..'+sha)=='1'
          env=os.environ.copy();env['GIT_CONFIG_COUNT']='1';env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+env.pop('PUBLISH_TOKEN')).encode()).decode()
          subprocess.run(['git','push','origin',sha+':refs/heads/work/dealguard-closedloop-20260919'],env=env,check=True)
          print('Validated non-production candidate:',sha)
          PY
