name: Development batch validation
on:
  push:
    branches: [feat/dealguard-3-phase1-release-baseline]
    paths: ['.development/**', '.github/workflows/development-batch.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dealguard
          POSTGRES_PASSWORD: dealguard-test-password
          POSTGRES_DB: dealguard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dealguard -d dealguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      INPUT_SHA: ${{ github.sha }}
      DATABASE_URL: postgresql://dealguard:dealguard-test-password@127.0.0.1:5432/dealguard_test
      DEALGUARD_ANALYTICS_TEST_DATABASE_URL: postgresql://dealguard:dealguard-test-password@127.0.0.1:5432/dealguard_test
      DEALGUARD_CUTOVER_TEST_DATABASE_URL: postgresql://dealguard:dealguard-test-password@127.0.0.1:5432/dealguard_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble and verify the reviewed source tree
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, hashlib, os, re, subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          base='c0e00ee39545962a20b616d549b840630ba231dd'
          target='faaec49f2152747826a933b0adced3a9f90f0552'
          parts=[f'.development/archive-patch-{i}.part' for i in range(5)]
          helpers=parts+['.github/workflows/development-batch.yml']
          assert git('rev-parse','HEAD')==os.environ['INPUT_SHA']
          subprocess.run(['git','merge-base','--is-ancestor',base,os.environ['INPUT_SHA']],check=True)
          assert set(git('diff','--name-only',base,os.environ['INPUT_SHA']).splitlines())==set(helpers)
          compressed=b''.join(Path(p).read_bytes() for p in parts)
          assert len(compressed)==23812
          assert hashlib.sha256(compressed).hexdigest()=='9aa184a660eee159afd775114d5f6442c2a6da946c052382c4ad2e2238714641'
          patch=gzip.decompress(compressed)
          assert len(patch)==90559
          for line in patch.decode().splitlines():
            if line.startswith('+++ b/'):
              p=line[6:]
              assert re.fullmatch(r'(database|docs|scripts|src|test|worker)/[A-Za-z0-9_./-]+',p) and '..' not in Path(p).parts
              assert not Path(p).is_symlink() and all(not a.is_symlink() for a in Path(p).parents)
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          p=Path('scripts/release-convergence.mjs')
          p.write_text(p.read_text().replace('length: 26','length: 28').replace('0026','0028'))
          subprocess.run(['git','add','scripts/release-convergence.mjs'],check=True)
          subprocess.run(['git','rm','--',*helpers],check=True)
          assert git('write-tree')==target
          subprocess.run(['git','-c','user.name=DealGuard development automation','-c','user.email=development@users.noreply.github.com','commit','-m','feat: verified record archive lifecycle and durable webhook receipt'],check=True)
          print('Reviewed product tree verified:',target)
          PY
      - name: Record exact candidate baseline
        run: node scripts/release-baseline.mjs --target staging
      - name: Install real Worker and UI dependencies
        run: |
          touch .env
          npm install --ignore-scripts --silent
          npm install --ignore-scripts --silent --prefix src/app/cards
          npm install --ignore-scripts --silent --prefix src/app/settings
          npm install --ignore-scripts --silent --prefix src/app/pages
      - name: Validate build contracts and additive migrations
        run: |
          npm run release:convergence
          npm run typecheck
          npm run typecheck --prefix src/app/cards
          npm run typecheck --prefix src/app/settings
          npm run typecheck --prefix src/app/pages
          npm run db:migrate
          npm run db:migrate:check
          npm run db:validate
      - name: Execute full regression suite
        shell: bash
        run: npm test 2>&1 | tee "$RUNNER_TEMP/batch-tests.log"
      - name: Preserve executed test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/batch-tests.log
          if-no-files-found: warn
          retention-days: 7
      - name: Package the tested commit
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          git bundle create "$RUNNER_TEMP/candidate/source.bundle" HEAD "^$INPUT_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/candidate/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7
  publish-candidate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
      - name: Verify and publish only a non-production candidate
        env:
          INPUT_SHA: ${{ github.sha }}
          PUBLISH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, re, subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          p=Path(os.environ['RUNNER_TEMP'])/'candidate'
          sha=(p/'commit.txt').read_text().strip()
          assert re.fullmatch('[0-9a-f]{40}',sha) and (p/'source.bundle').stat().st_size<2000000
          subprocess.run(['git','bundle','verify',str(p/'source.bundle')],check=True)
          subprocess.run(['git','fetch',str(p/'source.bundle'),'HEAD:refs/heads/validated-candidate'],check=True)
          assert git('rev-parse','validated-candidate')==sha
          assert git('rev-parse',sha+'^')==os.environ['INPUT_SHA']
          assert git('rev-parse',sha+'^{tree}')=='faaec49f2152747826a933b0adced3a9f90f0552'
          assert git('rev-list','--count',os.environ['INPUT_SHA']+'..'+sha)=='1'
          env=os.environ.copy()
          env['GIT_CONFIG_COUNT']='1'
          env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+env.pop('PUBLISH_TOKEN')).encode()).decode()
          subprocess.run(['git','push','origin',sha+':refs/heads/work/dealguard-archive-inbox-20260919'],env=env,check=True)
          print('Validated non-production candidate:',sha)
          PY
