name: P2 Decision Intelligence

on:
  pull_request:
    paths:
      - 'worker/src/config.ts'
      - 'worker/src/types.ts'
      - 'worker/src/hubspot.ts'
      - 'worker/src/deal-intelligence.ts'
      - 'worker/src/deal-history.ts'
      - 'worker/src/deal-momentum-types.ts'
      - 'worker/src/deal-momentum.ts'
      - 'worker/src/buyer-committee-data.ts'
      - 'worker/src/buyer-committee-types.ts'
      - 'worker/src/buyer-committee.ts'
      - 'worker/src/deal-brief-types.ts'
      - 'worker/src/deal-brief.ts'
      - 'worker/src/deal-brief-engagement.ts'
      - 'worker/src/deal-brief-commercial.ts'
      - 'worker/src/engagement-metadata-types.ts'
      - 'worker/src/engagement-metadata-data.ts'
      - 'worker/src/engagement-metadata-utils.ts'
      - 'worker/src/engagement-analysis.ts'
      - 'worker/src/engagement-signals.ts'
      - 'worker/src/engagement-actions.ts'
      - 'worker/src/engagement-intelligence.ts'
      - 'worker/src/commercial-integrity-types.ts'
      - 'worker/src/commercial-integrity-data.ts'
      - 'worker/src/commercial-integrity-analysis.ts'
      - 'worker/src/commercial-integrity-actions.ts'
      - 'worker/src/commercial-integrity.ts'
      - 'worker/src/commercial-assessment.ts'
      - 'worker/src/assessment-service.ts'
      - 'worker/src/routes-v2.ts'
      - 'worker/src/routes-v10.ts'
      - 'worker/src/routes-v11.ts'
      - 'worker/src/index.ts'
      - 'worker/src/enterprise-analytics-v2.ts'
      - 'database/migrations/0015_trustworthy_intelligence_currency.sql'
      - 'src/app/app-hsmeta.json'
      - 'src/app/cards/DealGuardEngagementCard.tsx'
      - 'src/app/cards/DealGuardCommercialCard.tsx'
      - 'src/app/cards/dealguard-engagement-card-hsmeta.json'
      - 'src/app/cards/dealguard-commercial-card-hsmeta.json'
      - 'src/app/cards/**'
      - 'src/app/pages/EnterpriseHomeV3.tsx'
      - 'src/app/pages/EnterpriseHomeV4.tsx'
      - 'src/app/pages/tsconfig.json'
      - 'test/p2-intelligence-contract.test.mjs'
      - 'test/trustworthy-intelligence.test.mjs'
      - 'test/deal-momentum.test.mjs'
      - 'test/deal-momentum-contract.test.mjs'
      - 'test/deal-history-client.test.mjs'
      - 'test/buyer-committee.test.mjs'
      - 'test/buyer-committee-contract.test.mjs'
      - 'test/deal-brief.test.mjs'
      - 'test/deal-brief-contract.test.mjs'
      - 'test/engagement-intelligence.test.mjs'
      - 'test/engagement-intelligence-contract.test.mjs'
      - 'test/deal-brief-engagement.test.mjs'
      - 'test/commercial-integrity.test.mjs'
      - 'test/commercial-integrity-data.test.mjs'
      - 'test/commercial-integrity-contract.test.mjs'
      - 'test/deal-brief-commercial.test.mjs'
      - 'scripts/postgres-migrate.mjs'
      - 'scripts/postgres-validate.mjs'
      - 'docs/ENTERPRISE_ANALYTICS.md'
      - 'docs/DEAL_MOMENTUM_AND_CLOSE_DATE.md'
      - 'docs/BUYER_COMMITTEE_INTELLIGENCE.md'
      - 'docs/DEAL_BRIEF.md'
      - 'docs/ENGAGEMENT_INTELLIGENCE.md'
      - 'docs/COMMERCIAL_INTEGRITY.md'
      - '.github/workflows/p2-decision-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dealguard
          POSTGRES_PASSWORD: dealguard-test-password
          POSTGRES_DB: dealguard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dealguard -d dealguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://dealguard:dealguard-test-password@127.0.0.1:5432/dealguard_test
      DEALGUARD_CUTOVER_TEST_DATABASE_URL: postgresql://dealguard:dealguard-test-password@127.0.0.1:5432/dealguard_test
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Create non-secret CI environment file
        run: touch .env
      - name: Install dependencies
        run: |
          npm install --ignore-scripts --silent
          npm install --ignore-scripts --silent --prefix src/app/cards
          npm install --ignore-scripts --silent --prefix src/app/pages
      - name: Typecheck analytics worker
        run: npm run typecheck
      - name: Typecheck deal intelligence cards
        run: npm run typecheck --prefix src/app/cards
      - name: Typecheck deployed enterprise Home
        run: npm run typecheck --prefix src/app/pages
      - name: Apply canonical PostgreSQL migrations
        id: migrations
        continue-on-error: true
        run: npm run db:migrate > p2-migrations.log 2>&1
      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-migrations-${{ github.sha }}
          path: p2-migrations.log
          retention-days: 7
      - name: Enforce migrations
        if: steps.migrations.outcome == 'failure'
        run: cat p2-migrations.log && exit 1
      - name: Validate PostgreSQL schema
        run: |
          npm run db:migrate:check
          npm run db:validate
      - name: Run trustworthy-intelligence tests
        run: node --test test/trustworthy-intelligence.test.mjs
      - name: Run deal-momentum tests
        run: node --test test/deal-momentum.test.mjs test/deal-momentum-contract.test.mjs test/deal-history-client.test.mjs
      - name: Run buyer-committee tests
        run: node --test test/buyer-committee.test.mjs test/buyer-committee-contract.test.mjs
      - name: Run Deal Brief tests
        run: node --test test/deal-brief.test.mjs test/deal-brief-contract.test.mjs
      - name: Run engagement-intelligence tests
        run: node --test test/engagement-intelligence.test.mjs test/engagement-intelligence-contract.test.mjs test/deal-brief-engagement.test.mjs
      - name: Run commercial-integrity tests
        run: node --test test/commercial-integrity.test.mjs test/commercial-integrity-data.test.mjs test/commercial-integrity-contract.test.mjs test/deal-brief-commercial.test.mjs
      - name: Run P2 contract tests
        run: node --test test/p2-intelligence-contract.test.mjs
      - name: Run full automated test suite
        run: npm test
