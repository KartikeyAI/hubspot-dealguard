name: Repair compliance export source

on:
  push:
    branches: [agent/neon-hyperdrive-tigris-queues]
    paths: [.github/workflows/repair-compliance-export.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neon-hyperdrive-tigris-queues
          fetch-depth: 0
      - name: Restore TypeScript template delimiters
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'worker/src/compliance.ts';
          let source = fs.readFileSync(path, 'utf8');
          const start = source.indexOf('export async function createDataExport');
          const end = source.indexOf('export async function applyComplianceRetention');
          if (start < 0 || end <= start) throw new Error('Compliance export block was not found.');
          let block = source.slice(start, end);
          block = block.replaceAll('\\`', '`').replaceAll('\\${', '${');
          source = source.slice(0, start) + block + source.slice(end);
          if (source.slice(start, end).includes('\\`') || source.slice(start, end).includes('\\${')) throw new Error('Escaped TypeScript templates remain.');
          fs.writeFileSync(path, source);
          fs.rmSync('.github/workflows/repair-compliance-export.yml');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "repair Tigris compliance export source"
          git push origin HEAD:agent/neon-hyperdrive-tigris-queues
