name: Repository inventory

on:
  push:
    branches: [agent/neon-hyperdrive-tigris-queues]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build persistence inventory
        shell: bash
        run: |
          mkdir -p inventory
          find worker/migrations -maxdepth 1 -type f -name '*.sql' -print | sort > inventory/migration-files.txt
          grep -RInE 'INSERT OR (IGNORE|REPLACE)|json_extract|julianday|datetime\(|strftime\(|PRAGMA|AUTOINCREMENT|last_insert_rowid|\.batch\(' worker/src worker/migrations > inventory/sqlite-specific.txt || true
          grep -RIl 'env\.DB\|\.DB\.' worker/src | sort > inventory/db-callers.txt
          : > inventory/migrations.sql.txt
          for f in $(cat inventory/migration-files.txt); do
            echo "--- $f ---" >> inventory/migrations.sql.txt
            cat "$f" >> inventory/migrations.sql.txt
            printf '\n' >> inventory/migrations.sql.txt
          done
          tar --exclude=.git --exclude=inventory --exclude=node_modules -czf repository-source.tar.gz .
      - name: Upload persistence inventory
        uses: actions/upload-artifact@v4
        with:
          name: repository-persistence-inventory
          path: inventory/
          if-no-files-found: error
          retention-days: 7
      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: repository-source
          path: repository-source.tar.gz
          if-no-files-found: error
          retention-days: 7
